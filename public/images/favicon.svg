<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  
  <rect width="100" height="100" rx="22" fill="#204c3c"/>

  <!-- ================= GORRO DE GRADUADO ================= -->
  <!-- Casquete -->
  <path d="M 37 25 L 37 32 C 37 37 42.8 40.5 50 40.5 C 57.2 40.5 63 37 63 32 L 63 25 Z" fill="#d5f477"/>
  <!-- Tapa romboide -->
  <polygon points="50,9 79,20.5 50,32 21,20.5" fill="#d5f477"/>
  <!-- Botón -->
  <circle cx="50" cy="20.5" r="2.2" fill="#204c3c"/>
  <!-- Borla blanca colgante -->
  <path d="M 50 20.5 Q 27 20.5 23 24.5 L 23 37" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <polygon points="20.5,36 25.5,36 27,44 19,44" fill="#ffffff"/>

  <!-- ================= CUADERNO ARGOLLADO ABIERTO ================= -->
  <!-- Pasta / Sombra base inferior -->
  <rect x="13" y="52" width="35" height="36" rx="4" fill="#13281f"/>
  <rect x="52" y="52" width="35" height="36" rx="4" fill="#13281f"/>

  <!-- Hoja izquierda (blanco marfil) -->
  <rect x="14" y="51" width="34" height="35" rx="3.5" fill="#ffffff"/>
  <!-- Renglones de estudio en página izquierda -->
  <line x1="19" y1="59" x2="43" y2="59" stroke="#cbdad1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="66" x2="43" y2="66" stroke="#cbdad1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="73" x2="43" y2="73" stroke="#cbdad1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="80" x2="35" y2="80" stroke="#cbdad1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hoja derecha (en lime vibrante #d5f477 - representa el checklist de prácticas) -->
  <rect x="52" y="51" width="34" height="35" rx="3.5" fill="#d5f477"/>
  <!-- Checklist / Tareas de práctica en página derecha -->
  <circle cx="58" cy="59" r="1.6" fill="#204c3c"/>
  <line x1="63" y1="59" x2="80" y2="59" stroke="#204c3c" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  
  <circle cx="58" cy="66" r="1.6" fill="#204c3c"/>
  <line x1="63" y1="66" x2="80" y2="66" stroke="#204c3c" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  
  <circle cx="58" cy="73" r="1.6" fill="#204c3c"/>
  <line x1="63" y1="73" x2="80" y2="73" stroke="#204c3c" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <circle cx="58" cy="80" r="1.6" fill="#204c3c"/>
  <line x1="63" y1="80" x2="73" y2="80" stroke="#204c3c" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Espiral / Argollas centrales que unen ambas páginas -->
  <g stroke="#204c3c" stroke-width="2.2" stroke-linecap="round">
    <ellipse cx="50" cy="55" rx="3.8" ry="2" fill="none"/>
    <ellipse cx="50" cy="62" rx="3.8" ry="2" fill="none"/>
    <ellipse cx="50" cy="69" rx="3.8" ry="2" fill="none"/>
    <ellipse cx="50" cy="76" rx="3.8" ry="2" fill="none"/>
    <ellipse cx="50" cy="83" rx="3.8" ry="2" fill="none"/>
  </g>

</svg>